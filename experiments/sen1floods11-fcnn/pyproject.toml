[project]
name = "sen1floods11-fcnn"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "geoexp", "ipykernel>=7,<8", "numpy==2.5.3", "rasterio==1.5.1",
  "torch==2.14.0+cu130", "torchvision==0.29.0+cu130",
  "pillow>=11", "tqdm==4.70.0", "ipywidgets==8.1.9",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
geoexp = { path = "../..", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
