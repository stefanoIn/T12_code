[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geoexp"
version = "0.1.0"
description = "Local, cross-platform thesis experiment runner"
requires-python = ">=3.11"
dependencies = ["psutil>=7,<8", "papermill>=2.6,<3", "uv>=0.8,<1"]

[project.scripts]
geoexp = "geoexp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoexp"]
